on_fail: "只修復部署或驗收失敗範圍，最多兩次；仍失敗則停止"
human_gate:
  - "已通過：Git Push"
  - "已通過：Deploy"
evidence:
  - "使用者直接授權 Push 與 Deploy"
state_writeback: "CURRENT_STATE.json"
