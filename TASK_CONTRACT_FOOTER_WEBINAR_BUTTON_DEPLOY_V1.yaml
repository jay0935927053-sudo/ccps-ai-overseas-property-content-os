    - "scripts/smoke-guide-ui.mjs"
    - "TASK_CONTRACT_FOOTER_USAGE_LINK_V1.yaml"
    - "TASK_CONTRACT_WEBINAR_ADMIN_BUTTON_V1.yaml"
    - "TASK_CONTRACT_FOOTER_WEBINAR_BUTTON_DEPLOY_V1.yaml"
