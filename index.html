<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCPS AI Overseas Property Content OS</title><style>
:root{--navy:#10243c;--gold:#c49a54;--cream:#f6f1e8;--ink:#17202a;--line:#d9d2c5;--ok:#e6f4ea;--warn:#fff4d6;--bad:#fde8e7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}header{background:var(--navy);color:white;padding:24px max(20px,calc((100% - 1180px)/2))}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:#d5deea}main{max-width:1180px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap}.tab{display:none}.tab.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #10243c0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:750;margin-bottom:4px}input,select,textarea,button{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:white}textarea{min-height:100px;resize:vertical}button{width:auto;cursor:pointer;font-weight:750}.primary{background:var(--navy);color:white;border-color:var(--navy)}.gold{background:var(--gold);color:#17110a;border-color:var(--gold)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:14px;min-height:70px}.status{padding:9px;border-radius:9px;margin:8px 0}.pass{background:var(--ok)}.warn{background:var(--warn)}.fail{background:var(--bad)}.list article{border-top:1px solid var(--line);padding:10px 0}.muted{color:#667085;font-size:13px}.metric{font-weight:800;color:var(--navy)}@media(max-width:680px){header{padding:18px}main{padding:12px}.grid,.grid3{grid-template-columns:1fr}.card{padding:14px}header h1{font-size:20px}}
</style></head><body><header><h1>CCPS AI Overseas Property Content OS</h1><p>海外置產內容、證據門禁與成效學習｜本機 V1</p></header><main>
<nav class="tabs"><button class="primary" data-tab="article">FB 信任文章</button><button data-tab="materials">素材庫</button><button data-tab="brand">品牌與 Voice</button><button data-tab="calendar">內容月曆</button><button data-tab="tracking">成效追蹤</button></nav>
<section id="article" class="tab active"><div class="card"><h2>CCPS FB 信任文章</h2><div class="grid3"><div><label>主題</label><input id="topic" value="吉隆坡置產怎麼判斷"></div><div><label>內容分類</label><select id="category"></select></div><div><label>文章角色</label><select id="contentRole"></select></div><div><label>Hook 類型</label><select id="hookType"></select></div><div><label>Narrative Type</label><select id="narrativeType"></select></div><div><label>文章目標</label><select id="goal"><option>高信任</option><option>高觸及</option><option>高留言</option><option>高分享</option><option>高收藏</option><option>高轉換</option></select></div><div><label>真實證據狀態</label><select id="evidenceState"></select></div><div><label>來源日期</label><input type="date" id="sourceDate"></div><div><label>圖片類型</label><input id="visualType" value="真實文件與區域地圖"></div></div><label>真實證據</label><textarea id="evidence" placeholder="貼上已查核事實、來源與界線；UNKNOWN 不會生成確定事實"></textarea><label>留言問題</label><input id="commentQuestion" value="你評估海外置產時，最想先查清楚哪一項？"><label>API Key（選填，僅目前分頁；V1 不會自動呼叫）</label><input id="apiKey" type="password" autocomplete="off" placeholder="不儲存、不自動送出"><div class="actions"><button id="generate" class="primary">生成文章</button><button id="preflight">防 AI 檢查</button><button id="regenerate">重新生成不同 DNA</button><button id="save" class="gold">儲存文章</button><button id="copy">複製</button><button id="download">下載</button></div><div id="gate" aria-live="polite"></div><h3>輸出</h3><div id="output" class="result">尚未生成。Evidence 不足時會輸出 EVIDENCE_REQUIRED。</div><div id="checks"></div><h3>多平台改寫</h3><div class="actions"><button id="rewrite">產生 Threads／LINE／Reels</button></div><div id="platformOutput" class="result">尚未改寫。</div></div><div class="card"><h2>最近文章</h2><div id="postList" class="list"></div></div></section>
<section id="materials" class="tab"><div class="card"><h2>CCPS 素材庫</h2><div class="grid3"><div><label>素材類型</label><select id="materialType"></select></div><div><label>Evidence State</label><select id="materialEvidence"></select></div><div><label>來源日期</label><input id="materialDate" type="date"></div><div><label>標題</label><input id="materialTitle"></div><div><label>來源</label><input id="materialSource"></div><div><label>區域</label><input id="materialRegion"></div><div><label>建案</label><input id="materialProperty"></div><div><label>客戶類型</label><input id="materialClient"></div><div><label>標籤</label><input id="materialTags"></div></div><label>內容</label><textarea id="materialBody"></textarea><label>隱私備註</label><input id="materialPrivacy"><label><input id="materialFresh" type="checkbox" style="width:auto"> 需要 Freshness 檢查</label><button id="saveMaterial" class="primary">儲存素材</button><div id="materialList" class="list"></div></div><div class="card"><h2>CCPS 信任內容來源庫</h2><p class="muted">整合 CCPS 官網、《馬來西亞置產寶典 V2.0》及通過公開邊界檢查的本機研究／視覺素材。法律、稅務、政策、匯率、價格與市場數據須回權威來源查證。</p><div class="grid3"><div><label>搜尋</label><input id="officialSearch" placeholder="搜尋標題、正文或區域"></div><div><label>來源庫</label><select id="officialSource"><option value="">全部來源</option></select></div><div><label>分類</label><select id="officialType"><option value="">全部分類</option></select></div></div><div id="officialSummary" class="status pass">正在載入信任內容來源…</div><div id="officialList" class="list"></div></div></section>
<section id="brand" class="tab"><div class="card"><h2>CCPS 品牌人設</h2><div class="grid"><div><label>品牌定位</label><input id="brandPosition"></div><div><label>服務區域</label><input id="brandArea"></div><div><label>核心客群</label><input id="brandAudience"></div><div><label>品牌語氣</label><input id="brandTone"></div><div><label>品牌原則</label><input id="brandPrinciples"></div><div><label>禁用話術</label><input id="brandForbidden"></div><div><label>固定結尾</label><input id="brandEnding" value="追蹤ccps家慶佳業" readonly></div></div><button id="saveBrand" class="primary">儲存品牌</button></div><div class="card"><h2>CCPS 寫作指紋</h2><div class="grid"><div><label>品牌常用語氣</label><input id="voiceTone"></div><div><label>可接受口語程度</label><input id="voiceColloquial"></div><div><label>第一／第三人稱</label><input id="voicePerson"></div><div><label>常用詞</label><input id="voiceWords"></div><div><label>禁用 AI 詞</label><input id="voiceForbidden"></div><div><label>品牌不能說的話</label><input id="voiceNever"></div><div><label>品牌核心原則</label><input id="voicePrinciples"></div></div><label>真實舊貼文範例 3–5 段</label><textarea id="voiceExamples"></textarea><button id="saveVoice" class="primary">儲存 Voice Fingerprint</button></div></section>
<section id="calendar" class="tab"><div class="card"><h2>內容月曆</h2><label>天數</label><select id="calendarDays"><option>7</option><option>10</option><option>14</option></select><button id="buildCalendar" class="primary">產生月曆</button><div id="calendarList" class="list"></div></div></section>
<section id="tracking" class="tab"><div class="card"><h2>成效回填</h2><div class="grid3"><div><label>文章</label><select id="trackingPost"></select></div><div><label>Reach</label><input id="reach" type="number" min="0" value="0"></div><div><label>Reactions</label><input id="reactions" type="number" min="0" value="0"></div><div><label>Comments</label><input id="comments" type="number" min="0" value="0"></div><div><label>Shares</label><input id="shares" type="number" min="0" value="0"></div><div><label>Saves</label><input id="saves" type="number" min="0" value="0"></div><div><label>Clicks</label><input id="clicks" type="number" min="0" value="0"></div><div><label>Inquiries</label><input id="inquiries" type="number" min="0" value="0"></div><div><label>Follows</label><input id="follows" type="number" min="0" value="0"></div></div><label>Qualitative Notes</label><textarea id="qualitativeNotes"></textarea><button id="saveTracking" class="primary">儲存成效</button><div id="trackingResult"></div></div></section>
</main><script type="module" src="./app.js"></script></body></html>
