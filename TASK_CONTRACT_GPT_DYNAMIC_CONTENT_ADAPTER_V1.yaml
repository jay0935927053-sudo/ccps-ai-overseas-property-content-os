    - "data/"
    - "assets/"
    - "ccps-rules.js 的品牌 CTA、禁用規則及安全門檻"
    - "ccps-brand-options.js 的既有品牌與寫作指紋選項"
    - "ccps-preflight.js 的既有安全檢查語意"
    - "ccps-storage.js 的既有 storage keys"
    - "ccps-multiplatform-engine.js"
    - "uhos-ai-director-migration/"
    - "Secrets、正式資料庫、OAuth、廣告、郵件或其他外部服務"
    - "自動 Push、Merge、Deploy 或發布"
    - "自動或批次付費 API 呼叫"
    - "將 API Key 寫入 localStorage、sessionStorage、檔案、URL、log、錯誤訊息或文章紀錄"
    - "未經使用者明確選擇就傳送任何素材"
    - "未通過素材雲端傳送資格檢查仍呼叫 API"

gpt_adapter_contract:
  endpoint: "https://api.openai.com/v1/responses"
  model: "gpt-5.6-terra"
  reasoning_effort: "low"
  max_output_tokens: 8000
  invocation: "只有 API Key 非空且使用者按下生成文章時，才允許單次呼叫；不得背景呼叫、重試付費步驟或自動 fallback 到其他模型。"
  secret_lifetime: "僅目前頁面記憶體；重新整理或關閉分頁後消失。"
  prompt_requirements:
    - "system prompt 必須使用 CCPS 內容總監角色、繁體中文、專業可執行、不浮誇、不保證報酬。"
    - "user prompt 必須逐欄包含文章欄位、完整品牌人設、完整寫作指紋、固定 CTA 與選用素材。"
    - "content_role、hook_type、narrative_type 必須是生成指令，不得只存入輸出 metadata。"
    - "素材的 evidence_state 或 freshness_required 需要查證時，提示詞必須要求保留查證提醒，不得改寫成已確認事實。"
    - "不得杜撰客戶、成交、會議、現場紀錄、價格、政策、法規、稅率、投報或保證性敘述。"
    - "結尾只能使用：追蹤ccps家慶佳業。"
  material_cloud_gate:
    allowed_privacy:
      - "無個資，可作公開內容候選"
      - "已匿名化客戶資料"
    blocked_privacy:
      - "含內部資訊，禁止公開"
      - "含客戶個資，需先移除"
      - "僅供內部研究"
      - "需主管確認公開範圍"
    blocked_visibility:
      - "internal_only"
    behavior: "被阻擋時不得呼叫 API，畫面必須指出素材不可傳送，並保留原素材不變。"
  failure_behavior:
    - "缺少 API Key：停止，不呼叫 API，顯示需輸入金鑰。"
    - "HTTP 或串流失敗：停止並顯示一般化錯誤，不顯示或記錄 API Key。"
    - "空白輸出：視為 FAIL，不建立文章物件。"
    - "Preflight BLOCK：不得儲存、不得交給多平台功能。"
    - "不得把固定模板輸出偽裝成 GPT 成功結果。"

acceptance_checks:
  - "既有素材庫、品牌與寫作指紋、Preflight、儲存、追蹤與多平台功能回歸 PASS"
  - "提示詞純函式逐欄包含 8 個文章欄位、6 個品牌欄位、8 個寫作指紋欄位及固定 CTA"
  - "選用一筆合格素材時，prompt 包含該素材內容、來源、日期、證據狀態與時效提醒"
  - "未選素材時不會傳送素材庫其他內容"
  - "六種受阻擋隱私／可見性狀態均在 fetch 前停止"
  - "API Key 不存在於 localStorage、sessionStorage、URL、console、prompt、文章物件或下載內容"
  - "content_role、hook_type、narrative_type 的不同測試值會進入 prompt 指令"
  - "GPT 回傳內容必須經既有 Preflight；BLOCK 時不能儲存或產生下游內容"
  - "成功 article 物件仍可供現有多平台產生器使用，且包含追蹤ccps家慶佳業"
  - "無 API Key、HTTP 失敗、空白輸出與 Preflight BLOCK 都有不同且可理解的繁體中文狀態"
  - "390x844 版面無橫向溢位，新增素材選擇與生成狀態可操作"
  - "未執行付費 API、Push 或 Deploy 也能完成所有自動驗收"

validators:
  - "git diff --check"
  - "node scripts/validate-ccps-os.mjs"
  - "在 scripts/validate-ccps-os.mjs 內以 mock fetch 驗證 request body、單次呼叫、失敗分支與 Secret 不落地"
  - "390x844 本機瀏覽器 smoke test"
  - "人工門禁後才允許一次真實 API 內容品質驗收"

repair_policy:
  max_passes: 2
  successful_steps_are_cached: true
  paid_execution: false
  rule: "只修失敗檢查及其直接相依；相同錯誤重複後停止，不重跑成功或付費步驟。"

on_pass: "HUMAN_GATE_SINGLE_PAID_API_CONTENT_REVIEW"
on_fail: "AUTO_REPAIR_FAILED_SCOPE_MAX_2_THEN_STOP"

human_gate:
  - "使用者自行輸入 OpenAI API Key；Key 不得出現在聊天或驗收證據"
  - "一次真實 OpenAI API 內容品質測試與可能費用"
  - "主觀確認輸出是否恢復原版品質"
  - "Git Push"
  - "Deploy"

