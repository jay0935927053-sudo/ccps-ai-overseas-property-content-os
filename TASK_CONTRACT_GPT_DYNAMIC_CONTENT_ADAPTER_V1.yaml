    - "可供既有 Preflight、儲存、成效追蹤、多平台改寫及圖片／影片製作稿使用的既有 article 物件"
    - "可驗證的 system prompt 與 user prompt 純函式，不包含 API Key"
    - "清楚區分 API 生成失敗、Preflight 阻擋與成功輸出三種狀態"
  allowed_changes:
