    - "app.js"
    - "ccps-content-engine.js"
    - "新增 ccps-gpt-adapter.js"
    - "scripts/validate-ccps-os.mjs"
    - "README.md"
    - "docs/CCPS_CONTENT_RULES.md"
    - "TASK_CONTRACT_GPT_DYNAMIC_CONTENT_ADAPTER_V1.yaml"
    - "CURRENT_STATE.json（僅在實作完成且驗收通過後寫回）"
